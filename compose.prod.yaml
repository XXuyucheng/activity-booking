# ECS 生产栈。不要在开发机上代替 compose.yaml。
# 本机日常仍是：docker compose up -d（5433/8000 + Vite 5173/5174）
#
# 服务器上的 .env 单独写，不要提交。证书放在宿主机：
#   /opt/activity-booking/certs/qucamp.cn_bundle.crt
#   /opt/activity-booking/certs/qucamp.cn.key
#   /opt/activity-booking/certs/admin.qucamp.cn_bundle.crt
#   /opt/activity-booking/certs/admin.qucamp.cn.key
#
# 前端 dist 在本机 build-static.sh 生成，不进 Git。构建 Nginx 镜像前 dist 必须在上下文里。
# 启动：docker compose -f compose.prod.yaml up -d --build
# Postgres 与 FastAPI 不映射到宿主机。对外只有 Nginx 的 80 和 443。

name: activity-booking

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: activity-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-activity_booking}
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_BASE_IMAGE: ${BACKEND_BASE_IMAGE:-python:3.12-slim}
    container_name: activity-booking-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-activity_booking}
      TZ: ${TZ:-Asia/Shanghai}
      UVICORN_RELOAD: "0"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s

  nginx:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: activity-booking-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CERTS_DIR:-/opt/activity-booking/certs}:/etc/nginx/certs:ro
      - ./deploy/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./wechat-verify:/usr/share/nginx/html/wechat-verify:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
