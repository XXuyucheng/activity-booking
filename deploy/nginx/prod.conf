# ECS 生产：按域名听 443，证书由 compose.prod.yaml 挂到 /etc/nginx/certs。
# 本机预览仍用 default.conf（8080/8081），不要在这台开发机上用这份配置。

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# www 的 80 直接跳到根域 HTTPS，避免先跳到 https://www 再跳一次
server {
    listen 80;
    server_name www.qucamp.cn;
    return 301 https://qucamp.cn$request_uri;
}

server {
    listen 80;
    server_name qucamp.cn admin.qucamp.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.qucamp.cn;

    ssl_certificate     /etc/nginx/certs/qucamp.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/qucamp.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://qucamp.cn$request_uri;
}

# 游客 H5：与 /api 同域，Cookie 写在 qucamp.cn
server {
    listen 443 ssl http2;
    server_name qucamp.cn;

    ssl_certificate     /etc/nginx/certs/qucamp.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/qucamp.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html/h5;
    index index.html;

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
    }

    location = /health {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
    }

    location /playground/ {
        try_files $uri $uri/ /playground/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 员工后台：独立域名，Cookie 与游客分开
server {
    listen 443 ssl http2;
    server_name admin.qucamp.cn;

    ssl_certificate     /etc/nginx/certs/admin.qucamp.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/admin.qucamp.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html/admin;
    index index.html;

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
    }

    location = /health {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
