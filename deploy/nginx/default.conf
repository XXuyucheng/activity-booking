# 本机预览：HTTP 托管 H5（容器 80）与员工后台（容器 81）。
# 生产 HTTPS 在 prod.conf，由 compose.prod.yaml 挂载，不改这份文件。

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# 游客 H5：同域 /api，Cookie 写在这个源上
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/h5;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location /playground/ {
        try_files $uri $uri/ /playground/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 员工后台：独立端口，与游客 Cookie 分源（对应现在的 5174）
server {
    listen 81;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
