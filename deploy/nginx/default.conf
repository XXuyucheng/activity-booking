# 本地 / 生产共用：HTTP 托管 H5 与员工后台，/api 与 /health 反代 FastAPI。
# HTTPS、server_name、证书留给第 21 步 ECS。

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# 游客 H5：同域 /api，Cookie 写在这个源上
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/h5;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location /playground/ {
        try_files $uri $uri/ /playground/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 员工后台：独立端口，与游客 Cookie 分源（对应现在的 5174）
server {
    listen 81;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
