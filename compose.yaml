# 营地活动预约：本地开发栈
# 启动：cp .env.example .env 后填写 POSTGRES_PASSWORD，再 docker compose up -d
# Postgres：127.0.0.1:${POSTGRES_HOST_PORT:-5433}
# Backend：127.0.0.1:${BACKEND_HOST_PORT:-8000}（容器内连 postgres:5432，覆盖 .env 的 127.0.0.1 DATABASE_URL）

name: activity-booking

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: activity-booking-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-activity_booking}
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_BASE_IMAGE: ${BACKEND_BASE_IMAGE:-python:3.12-slim}
    container_name: activity-booking-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-activity_booking}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s

volumes:
  postgres_data:
